services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./mern/server
    restart: unless-stopped
    environment:
      PORT: 5050
      ATLAS_URI: mongodb://mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./mern/client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: