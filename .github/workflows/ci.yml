name: MERN Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: mern/client
        run: npm ci

      - name: Build React frontend
        working-directory: mern/client
        run: npm run build

      - name: Set up Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern/server/package-lock.json

      - name: Install backend dependencies
        working-directory: mern/server
        run: npm ci --omit=dev

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./mern/client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-devops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-devops-frontend:${{ github.sha }}

      - name: Publish backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./mern/server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-devops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-devops-backend:${{ github.sha }}


  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy using AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09fb3ccc991bc6b2f" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters '{"commands":["cd /home/ubuntu/mern-deployment && docker compose pull && docker compose up -d"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-09fb3ccc991bc6b2f" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Waiting}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-09fb3ccc991bc6b2f" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-09fb3ccc991bc6b2f" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command."
          exit 1
